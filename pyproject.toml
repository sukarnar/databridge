[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "databridge"
version = "0.1.0"
description = "Visual source-to-target data mapping with a REST data broker, built on Flet and FastAPI"
requires-python = ">=3.11"
dependencies = [
    "flet[web]==1.0.1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "polars>=1.30,<2",
    "fastexcel>=0.21",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "duckdb>=1.3",
    "pyarrow>=18",
    "sqlalchemy[asyncio]>=2.0",
    "rapidfuzz>=3.9",
    "sqlglot>=26",
    "cryptography>=43",
    "python-multipart>=0.0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fsspec>=2024.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
oracle = ["oracledb"]
postgres = ["psycopg[binary]"]
mysql = ["pymysql"]
mssql = ["pyodbc"]
smb = ["smbprotocol"]
sftp = ["sshfs"]
s3 = ["s3fs"]
azure = ["adlfs"]
dev = ["pytest", "httpx", "pillow"]   # pillow: scripts/make_brand_assets.py

[tool.setuptools.packages.find]
include = ["databridge*"]

[tool.setuptools.package-data]
databridge = ["docs/guide/*.md", "docs/guide/img/*.png", "docs/guide/img/*.svg", "ui/branding/*.png", "ui/branding/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
