<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="Roboto, 'Segoe UI', Arial, sans-serif"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#515b92"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#515b92"/></marker></defs><text x="24" y="38" font-size="20" fill="#1b1b21" font-weight="700" text-anchor="start">DataBridge: system overview</text><text x="130" y="72" font-size="11.5" fill="#5f5f6b" font-weight="700" text-anchor="middle">PEOPLE AND SYSTEMS</text><rect x="30" y="86" width="200" height="70" rx="10" fill="#f4f4f6" stroke="#b9b9c3" stroke-width="1.5"/><text x="44" y="110" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="start">Studio users</text><text x="44" y="132" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Browser: design, map, publish</text><rect x="30" y="176" width="200" height="70" rx="10" fill="#f4f4f6" stroke="#b9b9c3" stroke-width="1.5"/><text x="44" y="200" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="start">Consumers</text><text x="44" y="222" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">BI tools, apps, Excel (REST)</text><rect x="30" y="266" width="200" height="70" rx="10" fill="#f4f4f6" stroke="#b9b9c3" stroke-width="1.5"/><text x="44" y="290" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="start">Schedulers</text><text x="44" y="312" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Stonebranch UAC, n8n, cron</text><rect x="280" y="150" width="150" height="120" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="355.0" y="174" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="middle">HTTPS proxy</text><text x="355.0" y="196" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="middle">Traefik (Docker)</text><text x="355.0" y="214" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="middle">or Nginx (native):</text><text x="355.0" y="232" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="middle">https + wss, TLS 1.2+</text><path d="M 230 121 L 255 121 L 255 180 L 280 180" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 230 211 L 280 211" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 230 301 L 255 301 L 255 240 L 280 240" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><rect x="470" y="60" width="530" height="620" rx="14" fill="#eef0fa" stroke="#9fa8da" stroke-width="1.5"/><text x="484" y="84" font-size="15" fill="#3f4a86" font-weight="700" text-anchor="start">DataBridge  (one Python process)</text><rect x="487" y="100" width="244" height="78" rx="10" fill="#ffffff" stroke="#515b92" stroke-width="1.5"/><text x="501" y="124" font-size="14" fill="#3f4a86" font-weight="700" text-anchor="start">Studio UI</text><text x="501" y="146" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Flet: pages, Mapping Studio,</text><text x="501" y="164" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">workflow canvas</text><rect x="739" y="100" width="244" height="78" rx="10" fill="#ffffff" stroke="#515b92" stroke-width="1.5"/><text x="753" y="124" font-size="14" fill="#3f4a86" font-weight="700" text-anchor="start">Broker API</text><text x="753" y="146" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">REST /api/v1 (X-API-Key)</text><text x="753" y="164" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">wss:// streaming API: events, rows</text><path d="M 430 190 L 450 190 L 450 139 L 487 139" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 430 230 L 460 230 L 460 196 L 861 196 L 861 178" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><text x="735" y="224" font-size="11.5" fill="#5f5f6b" font-weight="700" text-anchor="middle">SERVICES</text><rect x="487" y="236" width="160" height="92" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="501" y="260" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">Ingest</text><text x="501" y="282" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">sheet profiles, type</text><text x="501" y="300" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">detection, drift</text><rect x="655" y="236" width="160" height="92" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="669" y="260" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">Connectors</text><text x="669" y="282" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">files, databases, REST</text><text x="669" y="300" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">APIs; schedule, Explorer</text><rect x="823" y="236" width="160" height="92" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="837" y="260" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">Mapping engine</text><text x="837" y="282" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">row steps, formulas</text><text x="837" y="300" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">→ Polars, checks</text><rect x="487" y="340" width="160" height="92" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="501" y="364" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">Publish</text><text x="501" y="386" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">versioned datasets,</text><text x="501" y="404" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">reject reports</text><rect x="655" y="340" width="160" height="92" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="669" y="364" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">Endpoint queries</text><text x="669" y="386" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">filters, paging (DuckDB)</text><text x="669" y="404" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">JSON / CSV / XLSX</text><rect x="823" y="340" width="160" height="92" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="837" y="364" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">Auth &amp; security</text><text x="837" y="386" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">roles, audit log, wss</text><text x="837" y="404" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">only, origin checks</text><rect x="487" y="444" width="160" height="92" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="501" y="468" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">AI gateway</text><text x="501" y="490" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">keys, catalog, TLS,</text><text x="501" y="508" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">budgets, usage ledger</text><rect x="655" y="444" width="160" height="92" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="669" y="468" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">AI workflows</text><text x="669" y="490" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">nodes, runs, review,</text><text x="669" y="508" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">REST trigger</text><rect x="823" y="444" width="160" height="92" rx="10" fill="#fbeef0" stroke="#e2a3ae" stroke-width="1.5"/><text x="837" y="468" font-size="13" fill="#8f2438" font-weight="700" text-anchor="start">Guardrails</text><text x="837" y="490" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">PII masking, injection</text><text x="837" y="508" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">checks, output checks</text><rect x="487" y="556" width="496" height="104" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="501" y="580" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">Background</text><text x="501" y="602" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Scheduled source refreshes: REST APIs, tables, SQL, files (only changes kept)</text><text x="501" y="620" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Company model health checks, certificate and outage alerts (Slack/Teams)</text><text x="501" y="638" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Company LLM config file applied at every start</text><text x="1150.0" y="72" font-size="11.5" fill="#5f5f6b" font-weight="700" text-anchor="middle">STORAGE</text><rect x="1040" y="86" width="220" height="82" rx="10" fill="#e7f4f1" stroke="#7fbfb2" stroke-width="1.5"/><text x="1054" y="110" font-size="14" fill="#0f5e56" font-weight="700" text-anchor="start">Metadata database</text><text x="1054" y="132" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">PostgreSQL (Docker) or SQLite:</text><text x="1054" y="150" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">mappings, users, audit, runs</text><rect x="1040" y="184" width="220" height="100" rx="10" fill="#e7f4f1" stroke="#7fbfb2" stroke-width="1.5"/><text x="1054" y="208" font-size="14" fill="#0f5e56" font-weight="700" text-anchor="start">Data folder</text><text x="1054" y="230" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Parquet snapshots &amp; datasets,</text><text x="1054" y="248" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">reject reports, AI run files,</text><text x="1054" y="266" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">encryption key</text><path d="M 1000 127 L 1040 127" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 1000 234 L 1040 234" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><text x="1150.0" y="322" font-size="11.5" fill="#5f5f6b" font-weight="700" text-anchor="middle">EXTERNAL SYSTEMS</text><rect x="1040" y="336" width="220" height="150" rx="10" fill="#fdf3e3" stroke="#e3b574" stroke-width="1.5"/><text x="1054" y="360" font-size="14" fill="#8a4b0b" font-weight="700" text-anchor="start">Data sources</text><text x="1054" y="382" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Read by Connectors (use</text><text x="1054" y="400" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">read-only accounts)</text><text x="1054" y="418" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Shares, SFTP, S3/Azure/GCS</text><text x="1054" y="436" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Oracle, SQL Server, Postgres…</text><text x="1054" y="454" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">REST APIs: JSON, CSV, XML</text><rect x="1040" y="506" width="220" height="150" rx="10" fill="#fdf3e3" stroke="#e3b574" stroke-width="1.5"/><text x="1054" y="530" font-size="14" fill="#8a4b0b" font-weight="700" text-anchor="start">LLMs</text><text x="1054" y="552" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Called by the AI gateway,</text><text x="1054" y="570" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">only after the guardrails</text><text x="1054" y="588" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Company gateway &amp; local</text><text x="1054" y="606" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">models (internal network)</text><text x="1054" y="624" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Cloud providers (external)</text><path d="M 1000 411 L 1040 411" fill="none" stroke="#b36b12" stroke-width="1.8" marker-end="url(#head)"/><path d="M 1000 581 L 1040 581" fill="none" stroke="#b36b12" stroke-width="1.8" marker-end="url(#head)"/></svg>