<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" font-family="Roboto, 'Segoe UI', Arial, sans-serif"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#515b92"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#515b92"/></marker></defs><text x="24" y="38" font-size="20" fill="#1b1b21" font-weight="700" text-anchor="start">Deployment on a Linux server (e.g. Hostinger VPS), deployed from GitHub</text><rect x="24" y="70" width="250" height="110" rx="10" fill="#f4f4f6" stroke="#b9b9c3" stroke-width="1.5"/><text x="38" y="94" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="start">GitHub</text><text x="38" y="116" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Push to main → Actions run the</text><text x="38" y="134" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">tests, then deploy over SSH</text><text x="38" y="152" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">to option A or B (repository</text><text x="38" y="170" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">variable DEPLOY_MODE)</text><rect x="24" y="210" width="250" height="100" rx="10" fill="#f4f4f6" stroke="#b9b9c3" stroke-width="1.5"/><text x="38" y="234" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="start">Users &amp; consumers</text><text x="38" y="256" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">https://databridge.&lt;domain&gt;</text><text x="38" y="274" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">studio + /api/v1, through the</text><text x="38" y="292" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">proxy of either option</text><rect x="320" y="60" width="420" height="380" rx="14" fill="#eef0fa" stroke="#9fa8da" stroke-width="1.5"/><text x="334" y="84" font-size="15" fill="#3f4a86" font-weight="700" text-anchor="start">Option A: Docker</text><rect x="340" y="100" width="380" height="58" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="354" y="124" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="start">Traefik (existing)</text><text x="354" y="146" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">https + wss, Let&#x27;s Encrypt, TLS 1.2+, rate limit on /api</text><rect x="340" y="180" width="180" height="110" rx="10" fill="#ffffff" stroke="#515b92" stroke-width="1.5"/><text x="354" y="204" font-size="14" fill="#3f4a86" font-weight="700" text-anchor="start">app container</text><text x="354" y="226" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">image from GHCR</text><text x="354" y="244" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">databridge.serve, 1 worker</text><text x="354" y="262" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">volume: /data</text><rect x="540" y="180" width="180" height="110" rx="10" fill="#e7f4f1" stroke="#7fbfb2" stroke-width="1.5"/><text x="554" y="204" font-size="14" fill="#0f5e56" font-weight="700" text-anchor="start">postgres container</text><text x="554" y="226" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">internal network only</text><text x="554" y="244" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">volume: postgres-data</text><rect x="340" y="310" width="380" height="110" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="354" y="334" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">Deploy steps</text><text x="354" y="356" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">build &amp; push image → copy compose over SSH →</text><text x="354" y="374" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">pull &amp; up -d → /health check → keep previous</text><text x="354" y="392" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">image tag for rollback</text><path d="M 430 158 L 430 180" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 520 235 L 540 235" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><rect x="770" y="60" width="410" height="380" rx="14" fill="#eef0fa" stroke="#9fa8da" stroke-width="1.5"/><text x="784" y="84" font-size="15" fill="#3f4a86" font-weight="700" text-anchor="start">Option B: native (no Docker)</text><rect x="790" y="100" width="370" height="58" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="804" y="124" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="start">Nginx + certbot</text><text x="804" y="146" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">https + wss, TLS 1.2+, proxy to 127.0.0.1:8000</text><rect x="790" y="180" width="175" height="110" rx="10" fill="#ffffff" stroke="#515b92" stroke-width="1.5"/><text x="804" y="204" font-size="14" fill="#3f4a86" font-weight="700" text-anchor="start">systemd service</text><text x="804" y="226" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">databridge.serve (uv venv)</text><text x="804" y="244" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">releases/&lt;id&gt; +</text><text x="804" y="262" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">current symlink</text><rect x="985" y="180" width="175" height="110" rx="10" fill="#e7f4f1" stroke="#7fbfb2" stroke-width="1.5"/><text x="999" y="204" font-size="14" fill="#0f5e56" font-weight="700" text-anchor="start">Storage</text><text x="999" y="226" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">SQLite or PostgreSQL</text><text x="999" y="244" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">shared/data, shared/.env</text><text x="999" y="262" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">nightly backup</text><rect x="790" y="310" width="370" height="110" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="804" y="334" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">Deploy steps</text><text x="804" y="356" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">rsync release → uv sync → switch symlink →</text><text x="804" y="374" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">restart → /health must report the new release,</text><text x="804" y="392" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">else automatic rollback</text><path d="M 880 158 L 880 180" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 965 235 L 985 235" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><text x="160" y="345" font-size="12" fill="#5f5f6b" font-weight="400" text-anchor="middle">Same app either way: configuration in</text><text x="160" y="363" font-size="12" fill="#5f5f6b" font-weight="400" text-anchor="middle">.env (DATABRIDGE_*), company LLMs in</text><text x="160" y="381" font-size="12" fill="#5f5f6b" font-weight="400" text-anchor="middle">an optional YAML config file</text><rect x="24" y="400" width="250" height="88" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="38" y="424" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">No proxy?</text><text x="38" y="446" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Built-in TLS: DATABRIDGE_TLS_*</text><text x="38" y="464" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">serves https + wss itself,</text><text x="38" y="482" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">optional mutual TLS</text></svg>