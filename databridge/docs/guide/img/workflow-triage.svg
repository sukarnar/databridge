<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" font-family="Roboto, 'Segoe UI', Arial, sans-serif"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#515b92"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#515b92"/></marker></defs><text x="24" y="38" font-size="20" fill="#1b1b21" font-weight="700" text-anchor="start">Example workflow: triage support tickets</text><rect x="24" y="96" width="190" height="132" rx="10" fill="#e7f4f1" stroke="#7fbfb2" stroke-width="1.5"/><text x="38" y="120" font-size="14" fill="#0f5e56" font-weight="700" text-anchor="start">Tickets</text><text x="38" y="142" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Dataset rows</text><text x="38" y="160" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Source: Support tickets</text><text x="38" y="178" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">filter: note not blank</text><rect x="254" y="96" width="190" height="132" rx="10" fill="#eef0fa" stroke="#9fa8da" stroke-width="1.5"/><text x="268" y="120" font-size="14" fill="#3f4a86" font-weight="700" text-anchor="start">Prepare</text><text x="268" y="142" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Transform</text><text x="268" y="160" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">short_note =</text><text x="268" y="178" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">LEFT([note], 800)</text><text x="268" y="196" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">keep LEN(note) &gt;= 10</text><rect x="484" y="96" width="250" height="132" rx="10" fill="#fdf3e3" stroke="#e3b574" stroke-width="1.5"/><text x="498" y="120" font-size="14" fill="#8a4b0b" font-weight="700" text-anchor="start">Classify ticket</text><text x="498" y="142" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">LLM · one call per row</text><text x="498" y="160" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">sends: ticket_id, product,</text><text x="498" y="178" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">channel, short_note</text><text x="498" y="196" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">JSON: category, urgency,</text><text x="498" y="214" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">summary, ticket_ref</text><rect x="774" y="96" width="170" height="132" rx="10" fill="#eef0fa" stroke="#9fa8da" stroke-width="1.5"/><text x="788" y="120" font-size="14" fill="#3f4a86" font-weight="700" text-anchor="start">Urgent?</text><text x="788" y="142" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Router</text><text x="788" y="160" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">[urgency] &gt;= 4</text><rect x="1004" y="60" width="252" height="96" rx="10" fill="#ffffff" stroke="#515b92" stroke-width="1.5"/><text x="1018" y="84" font-size="14" fill="#3f4a86" font-weight="700" text-anchor="start">Urgent tickets</text><text x="1018" y="106" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Output dataset</text><text x="1018" y="124" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">new snapshot each run</text><rect x="1004" y="196" width="252" height="96" rx="10" fill="#ffffff" stroke="#515b92" stroke-width="1.5"/><text x="1018" y="220" font-size="14" fill="#3f4a86" font-weight="700" text-anchor="start">Other tickets</text><text x="1018" y="242" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Output dataset</text><text x="1018" y="260" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">new snapshot each run</text><path d="M 214 162 L 254 162" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 444 162 L 484 162" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 734 162 L 774 162" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 944 142 L 974 142 L 974 108 L 1004 108" fill="none" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#head)"/><path d="M 944 182 L 974 182 L 974 244 L 1004 244" fill="none" stroke="#e65100" stroke-width="1.8" marker-end="url(#head)"/><text x="990" y="98" font-size="12" fill="#2e7d32" font-weight="700" text-anchor="middle">yes</text><text x="990" y="262" font-size="12" fill="#e65100" font-weight="700" text-anchor="middle">no</text><text x="119" y="254" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="middle">180 rows</text><text x="349" y="254" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="middle">176 rows (+ short_note)</text><text x="609" y="254" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="middle">176 rows (+ 4 answer columns)</text><text x="859" y="254" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="middle">31 yes · 145 no</text><rect x="484" y="290" width="250" height="116" rx="10" fill="#fbeef0" stroke="#e2a3ae" stroke-width="1.5"/><text x="498" y="314" font-size="13" fill="#8f2438" font-weight="700" text-anchor="start">Guardrails on this node</text><text x="498" y="336" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">email, customer: PII, not sent</text><text x="498" y="354" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">rule: urgency 1 to 5</text><text x="498" y="372" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">ticket_ref must = ticket_id</text><text x="498" y="390" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">injection: flag</text><path d="M 609 290 L 609 264" fill="none" stroke="#515b92" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#head)"/><rect x="24" y="290" width="420" height="116" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="38" y="314" font-size="13" fill="#3a3a44" font-weight="700" text-anchor="start">Review table (every run)</text><text x="38" y="336" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Flagged rows: kept, with an ai_review note</text><text x="38" y="354" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Rejected rows: left the flow, with node and reason</text><text x="38" y="372" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Nothing disappears silently</text></svg>