<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Roboto, 'Segoe UI', Arial, sans-serif"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#515b92"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#515b92"/></marker></defs><text x="24" y="38" font-size="20" fill="#1b1b21" font-weight="700" text-anchor="start">How an AI call works: every call passes the guardrails and the gateway</text><rect x="24" y="90" width="170" height="150" rx="10" fill="#f4f4f6" stroke="#b9b9c3" stroke-width="1.5"/><text x="38" y="114" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="start">Callers</text><text x="38" y="136" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Playground</text><text x="38" y="154" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">AI suggest (mapping)</text><text x="38" y="172" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Workflow LLM nodes</text><text x="38" y="190" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">REST: workflow runs</text><rect x="234" y="70" width="250" height="190" rx="10" fill="#fbeef0" stroke="#e2a3ae" stroke-width="1.5"/><text x="248" y="94" font-size="14" fill="#8f2438" font-weight="700" text-anchor="start">Guardrails: before sending</text><text x="248" y="116" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Column classification</text><text x="248" y="134" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">(PII / confidential, follows data)</text><text x="248" y="152" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Network rules: block confidential</text><text x="248" y="170" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">for external models</text><text x="248" y="188" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">PII masking / pseudonymizing</text><text x="248" y="206" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Prompt-injection check, &lt;data&gt; tags</text><text x="248" y="224" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Row, token and budget limits</text><rect x="524" y="70" width="250" height="190" rx="10" fill="#eef0fa" stroke="#9fa8da" stroke-width="1.5"/><text x="538" y="94" font-size="14" fill="#3f4a86" font-weight="700" text-anchor="start">Model gateway</text><text x="538" y="116" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Role + model approval (catalog)</text><text x="538" y="134" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Key: company key, your issued key,</text><text x="538" y="152" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">or your personal cloud key</text><text x="538" y="170" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">TLS: company CA, mutual TLS</text><text x="538" y="188" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Monthly budget per user</text><text x="538" y="206" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Usage ledger (no text by default)</text><text x="538" y="224" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Audit log</text><rect x="814" y="70" width="170" height="190" rx="10" fill="#fdf3e3" stroke="#e3b574" stroke-width="1.5"/><text x="828" y="94" font-size="14" fill="#8a4b0b" font-weight="700" text-anchor="start">LLM</text><text x="828" y="116" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Company gateway</text><text x="828" y="134" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Local: Ollama, vLLM,</text><text x="828" y="152" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">LM Studio (internal)</text><text x="828" y="170" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start"></text><text x="828" y="188" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Cloud providers</text><text x="828" y="206" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">(external)</text><rect x="1014" y="70" width="170" height="190" rx="10" fill="#fbeef0" stroke="#e2a3ae" stroke-width="1.5"/><text x="1028" y="94" font-size="14" fill="#8f2438" font-weight="700" text-anchor="start">Guardrails: after</text><text x="1028" y="116" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">JSON schema + retry</text><text x="1028" y="134" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Formula rules</text><text x="1028" y="152" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">No invented values</text><text x="1028" y="170" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">PII leak check</text><text x="1028" y="188" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Banned words, length</text><path d="M 194 165 L 234 165" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 484 165 L 524 165" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 774 165 L 814 165" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><path d="M 984 165 L 1014 165" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><rect x="234" y="290" width="950" height="80" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="248" y="314" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="start">Outcome per row</text><text x="248" y="336" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Pass → result columns  ·  Flag → kept with an ai_review note  ·  Reject → review table with the reason  ·  Stop → run blocked</text><text x="248" y="354" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Test runs keep the exact (masked) prompts and replies for review</text><path d="M 1099 260 L 1099 290" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/></svg>