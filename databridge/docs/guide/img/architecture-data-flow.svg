<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="Roboto, 'Segoe UI', Arial, sans-serif"><rect width="100%" height="100%" rx="14" fill="#ffffff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#515b92"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#515b92"/></marker></defs><text x="24" y="38" font-size="20" fill="#1b1b21" font-weight="700" text-anchor="start">How data flows: from a file or table to an endpoint</text><rect x="24" y="90" width="168" height="110" rx="10" fill="#fdf3e3" stroke="#e3b574" stroke-width="1.5"/><text x="38" y="114" font-size="15" fill="#8a4b0b" font-weight="700" text-anchor="start">Source</text><text x="38" y="136" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Spreadsheet upload, file</text><text x="38" y="154" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">on a share, table/SQL,</text><text x="38" y="172" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">REST API (JSON/CSV/XML)</text><text x="108.0" y="78" font-size="13" fill="#515b92" font-weight="700" text-anchor="middle">1</text><rect x="222" y="90" width="168" height="110" rx="10" fill="#ffffff" stroke="#c9cbd6" stroke-width="1.5"/><text x="236" y="114" font-size="15" fill="#3a3a44" font-weight="700" text-anchor="start">Ingest</text><text x="236" y="136" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Sheet profile: header,</text><text x="236" y="154" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">skipped rows, types</text><text x="236" y="172" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">(same every version)</text><text x="306.0" y="78" font-size="13" fill="#515b92" font-weight="700" text-anchor="middle">2</text><path d="M 192 145 L 222 145" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><rect x="420" y="90" width="168" height="110" rx="10" fill="#e7f4f1" stroke="#7fbfb2" stroke-width="1.5"/><text x="434" y="114" font-size="15" fill="#0f5e56" font-weight="700" text-anchor="start">Snapshot</text><text x="434" y="136" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Versioned Parquet,</text><text x="434" y="154" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">schema drift detected,</text><text x="434" y="172" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">duplicates skipped</text><text x="504.0" y="78" font-size="13" fill="#515b92" font-weight="700" text-anchor="middle">3</text><path d="M 390 145 L 420 145" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><rect x="618" y="90" width="168" height="110" rx="10" fill="#eef0fa" stroke="#9fa8da" stroke-width="1.5"/><text x="632" y="114" font-size="15" fill="#3f4a86" font-weight="700" text-anchor="start">Mapping</text><text x="632" y="136" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Row steps → rules</text><text x="632" y="154" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">(formulas) → types</text><text x="632" y="172" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">→ data checks</text><text x="702.0" y="78" font-size="13" fill="#515b92" font-weight="700" text-anchor="middle">4</text><path d="M 588 145 L 618 145" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><rect x="816" y="90" width="168" height="110" rx="10" fill="#e7f4f1" stroke="#7fbfb2" stroke-width="1.5"/><text x="830" y="114" font-size="15" fill="#0f5e56" font-weight="700" text-anchor="start">Dataset</text><text x="830" y="136" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Published version</text><text x="830" y="154" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">(Parquet) + reject</text><text x="830" y="172" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">report with reasons</text><text x="900.0" y="78" font-size="13" fill="#515b92" font-weight="700" text-anchor="middle">5</text><path d="M 786 145 L 816 145" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><rect x="1014" y="90" width="168" height="110" rx="10" fill="#ffffff" stroke="#515b92" stroke-width="1.5"/><text x="1028" y="114" font-size="15" fill="#3f4a86" font-weight="700" text-anchor="start">Endpoint</text><text x="1028" y="136" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Filters, paging,</text><text x="1028" y="154" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">JSON / CSV / XLSX,</text><text x="1028" y="172" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">API key or public</text><text x="1098.0" y="78" font-size="13" fill="#515b92" font-weight="700" text-anchor="middle">6</text><path d="M 984 145 L 1014 145" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><rect x="1014" y="240" width="168" height="90" rx="10" fill="#f4f4f6" stroke="#b9b9c3" stroke-width="1.5"/><text x="1028" y="264" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="start">Consumers</text><text x="1028" y="286" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">GET /api/v1/data/&lt;slug&gt;</text><text x="1028" y="304" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">BI, apps, Excel</text><path d="M 1098.0 200 L 1098.0 240" fill="none" stroke="#515b92" stroke-width="1.8" marker-end="url(#head)"/><rect x="24" y="240" width="564" height="90" rx="10" fill="#f4f4f6" stroke="#b9b9c3" stroke-width="1.5"/><text x="38" y="264" font-size="14" fill="#3a3a44" font-weight="700" text-anchor="start">Automation</text><text x="38" y="286" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">New file: POST /api/v1/ingest/&lt;id&gt;  ·  connection: POST /api/v1/sources/&lt;id&gt;/refresh</text><text x="38" y="304" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">→ snapshot → every mapping using the source republishes automatically</text><text x="38" y="322" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">The reply reports drift, paused mappings and rejected rows (with run_id)</text><path d="M 276.0 240 L 276.0 200" fill="none" stroke="#515b92" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#head)"/><rect x="618" y="240" width="366" height="90" rx="10" fill="#fbeef0" stroke="#e2a3ae" stroke-width="1.5"/><text x="632" y="264" font-size="13" fill="#8f2438" font-weight="700" text-anchor="start">Rejected rows never block good ones</text><text x="632" y="286" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">Failed conversions, missing required values and</text><text x="632" y="304" font-size="12.5" fill="#5f5f6b" font-weight="400" text-anchor="start">failed checks go to the reject report (View rejects)</text></svg>