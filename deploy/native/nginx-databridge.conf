# Nginx site for DataBridge (native install). install.sh replaces __DOMAIN__ and __PORT__,
# then certbot adds the HTTPS server block and the HTTP->HTTPS redirect.
#
#   /api/v1/stream     -> streaming API (secure websocket, wss://), API key required
#   /api/..., /health  -> public, rate limited (data routes still need X-API-Key)
#   everything else    -> studio and its websocket /ws (sign-in happens in the app)
#
# Secure websockets: browsers use wss:// automatically on the https:// site. Nginx passes the Upgrade headers
# and X-Forwarded-Proto so DataBridge can refuse anything that didn't arrive over TLS. DataBridge itself checks
# the Origin (cross-site websocket hijacking), limits connections and sets HSTS and the other security headers.
#
# TLS: certbot's options-ssl-nginx.conf already allows only TLS 1.2 and 1.3. If you manage certificates
# yourself, add to the HTTPS server block:
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_tickets off;

limit_req_zone $binary_remote_addr zone=databridge_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=databridge_ws:10m;

map $http_upgrade $databridge_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream databridge_app {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 110m;   # keep above DATABRIDGE_MAX_UPLOAD_MB

    proxy_http_version 1.1;
    # Note: every location below repeats the Host / X-Forwarded-* headers. Nginx ignores server-level
    # proxy_set_header lines in a location that sets any header itself, and DataBridge needs them to know the
    # browser used HTTPS (else it refuses wss:// and redirects) and who the client is (per-address limits).

    # Streaming API: websocket upgrade, long-lived. Handshakes are rate limited like the rest of the API.
    location = /api/v1/stream {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=databridge_api burst=40 nodelay;
        limit_conn databridge_ws 30;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $databridge_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://databridge_app;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=databridge_api burst=40 nodelay;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_pass http://databridge_app;
    }

    location = /health {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://databridge_app;
    }

    # Studio: Flet UI, its websocket (/ws) and uploads. Users sign in inside the app.
    # Optional extra layer, e.g. office IPs only:  allow 203.0.113.0/24;  deny all;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_conn databridge_ws 60;   # studio tabs + page requests per address
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $databridge_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://databridge_app;
    }
}
